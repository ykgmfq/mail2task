name: Publish container image

on:
  push:
    tags: ["v*"]
  # Rebuild monthly so the published image picks up base image security
  # patches even when the source has not changed.
  schedule:
    - cron: "0 4 1 * *"
  # Allow rebuilding on demand from the Actions tab, for example to pull in a
  # base image patch without waiting for the monthly run.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags are needed to find the newest one on scheduled runs.
          fetch-depth: 0

      # Always build a release tag, so the monthly rebuild refreshes the
      # latest release instead of publishing unreleased commits from main.
      - name: Resolve release tag
        id: rel
        run: .github/scripts/resolve-release.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The pushed image is an index (it carries provenance attestations),
          # and GHCR reads the package description from the index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/mail2task
          tags: |
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.rel.outputs.short_sha }}
          # The GitHub repo "About" field is empty, so set the description
          # explicitly; this flows into both labels and annotations.
          labels: |
            org.opencontainers.image.description=Poll an IMAP folder, enrich each email with Ollama, and create Todoist tasks.
            org.opencontainers.image.revision=${{ steps.rel.outputs.revision }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.rel.outputs.version }}
            REVISION=${{ steps.rel.outputs.revision }}
            CREATED=${{ steps.rel.outputs.created }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
