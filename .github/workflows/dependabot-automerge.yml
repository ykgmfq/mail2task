name: Auto-merge Dependabot updates

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only act on Dependabot's own pull requests.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-slim
    steps:
      - name: Read the update details
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6

      - name: Enable auto-merge for non-major updates
        run: .github/scripts/automerge-dependabot.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATES_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
